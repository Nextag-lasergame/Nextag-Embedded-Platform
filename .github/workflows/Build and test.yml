name: Build and test

on: [push]

env:
  BUILD_TYPE: Release

jobs:
  verify-formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: false

      - name: Verify formatting
        uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: '20'
          check-path: '.'

  Native-build-and-test:
    runs-on: ubuntu-latest
    needs: verify-formatting
    
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Build docker container
      run:
        docker build -t avr-gcc-toolchain:latest -f Dockerfile . --platform=linux/amd64

    - name: Configure CMake
      run: >
        docker run --rm -v ${{ github.workspace }}:/Nextag-Embedded-Base avr-gcc-toolchain
        cmake -G Ninja
        -S /Nextag-Embedded-Base/
        -B /Nextag-Embedded-Base/build/${{ matrix.build_type }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DNEXTAG_EMBEDDED_PLATFORM_CONFIGURE_AS_UNO=ON

    - name: Build
      run: >
        docker run --rm -v ${{ github.workspace }}:/Nextag-Embedded-Base avr-gcc-toolchain
        ninja -C /Nextag-Embedded-Base/build/${{ matrix.build_type }} -j $(nproc)

    - name: Test
      run: > 
        docker run --rm -v ${{ github.workspace }}:/Nextag-Embedded-Base avr-gcc-toolchain
        ctest --test-dir /Nextag-Embedded-Base/build/${{ matrix.build_type }} -C ${{matrix.build_type}} --output-on-failure
